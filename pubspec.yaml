name: ict_hub_project
description: "A Flutter e-commerce app with authentication flow, product listing, categories, and settings."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1
  dio: ^5.3.1
  get_it: ^7.6.0
  go_router: ^12.0.0
  json_serializable: ^6.7.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
